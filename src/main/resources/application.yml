spring:
  application:
    name: signal
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:signal}
    username: ${DB_USER:signal}
    password: ${DB_PASSWORD:signal_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names:
      - feedCache
      - sourcesCache
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Resilience4j Defaults
resilience4j:
  ratelimiter:
    instances:
      feedHostLimiter:
        limit-for-period: 2
        limit-refresh-period: 1s
        timeout-duration: 5s
  retry:
    instances:
      feedRetry:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2

# Signal App Specific Configurations
signal:
  ingestion:
    user-agent: "SignalNewsAggregator/1.0 (+https://github.com/com-signal/personal-news-aggregator; personal-tool)"
    default-fetch-interval-minutes: 30
    connect-timeout-seconds: 10
    read-timeout-seconds: 15
    max-body-size-bytes: 5242880 # 5MB

